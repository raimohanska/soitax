<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Rhythm notation reading trainer — read the notes, tap the rhythm.">
<!-- so "Add to Home Screen" gives a full-screen app with no browser chrome -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pulse">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --page:#ffffff;
    --panel:#f7f7f5;
    --ink:#141418;
    --line:#e3e3de;
    --rule:#d4d4ce;
    --mute:#6d6d75;
    --soft:#9a9aa2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html{background:#ffffff !important;color-scheme:light;}
  body{background:#ffffff !important;color:#141418;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  #backdrop{position:fixed;inset:0;background:#ffffff;z-index:-1;}
  body{
    min-height:100vh;display:flex;justify-content:center;
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;overscroll-behavior:none;
  }
  .wrap{width:100%;max-width:460px;padding:26px 18px 30px;display:flex;flex-direction:column;gap:20px;
        background:#ffffff;min-height:100vh;}

  /* ---- header ---- */
  header{display:flex;align-items:flex-end;justify-content:space-between;}
  .mark{font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:#141418;font-weight:600;}
  .meta{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;font-size:10.5px;letter-spacing:.06em;
        color:#6d6d75;text-align:right;line-height:1.6;}

  /* ---- level ---- */
  .lv{display:flex;align-items:center;gap:14px;padding-bottom:16px;border-bottom:1px solid #d4d4ce;}
  .lv-txt{flex:1;font-size:12px;color:#6d6d75;letter-spacing:.02em;}
  .lv-txt b{color:#141418;font-weight:600;}
  .stepper{display:flex;gap:6px;}
  .stepper button{
    width:32px;height:32px;border:1px solid #d4d4ce;background:#fff;border-radius:50%;
    color:#141418;font-size:15px;cursor:pointer;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1;
    display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s;
  }
  .stepper button:active{background:#141418;color:#fff;border-color:#141418;}
  .stepper button:disabled{opacity:.3;}

  .beats{display:flex;gap:8px;justify-content:center;height:10px;align-items:center;}
  .beats i{
    width:8px;height:8px;border-radius:50%;background:#e3e3de;display:block;
    transition:background-color 60ms linear,transform 60ms linear;
  }
  .beats i.on{background:#6d6d75;}
  .beats i.accent{background:#141418;transform:scale(1.5);}

  /* ---- tempo ---- */
  .tempo{display:flex;align-items:stretch;gap:10px;}
  .tbtn{
    flex:1 1 0;min-height:58px;border:1.5px solid #141418;background:#fff;border-radius:3px;
    color:#141418;font-size:30px;line-height:1;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
    transition:background .12s,color .12s;
  }
  .tbtn:active{background:#141418;color:#fff;}
  .tbtn:disabled{opacity:.25;}
  .tread{
    flex:1.5 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border:1px solid #e3e3de;border-radius:3px;background:#f7f7f5;gap:1px;
  }
  .tval{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;font-size:27px;line-height:1;color:#141418;}
  .tunit{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;font-size:9px;letter-spacing:.18em;color:#6d6d75;}

  /* ---- notation ---- */
  .score{display:flex;flex-direction:column;gap:2px;min-height:90px;}
  .score svg{display:block;max-width:100%;overflow:visible;}

  /* ---- deck: prev · pad · next ---- */
  .deck{display:flex;align-items:stretch;gap:10px;}
  .nav{
    flex:0 0 46px;border:1px solid #d4d4ce;background:#fff;border-radius:3px;
    color:#141418;font-size:26px;line-height:1;cursor:pointer;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex;align-items:center;justify-content:center;padding:0;
    transition:background .15s,border-color .15s,opacity .15s;
  }
  .nav:active{background:#141418;color:#fff;border-color:#141418;}
  .nav:disabled{opacity:.25;}
  /* after a good run, the forward arrow becomes the obvious next move */
  .nav.suggest{background:#141418;color:#fff;border-color:#141418;}

  .pad{
    position:relative;flex:1 1 auto;min-height:140px;
    border:1.5px solid #141418;border-radius:3px;background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
    cursor:pointer;overflow:hidden;transition:background .15s,border-color .15s;
    touch-action:none;
  }
  .pad-main{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#141418;
            font-weight:600;transition:color .15s;text-align:center;}
  .pad-sub{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;font-size:10px;letter-spacing:.06em;
           color:#6d6d75;text-align:center;padding:0 8px;}
  .pad[data-m="count"]{background:#f7f7f5;}
  .pad[data-m="count"] .pad-main{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;font-size:58px;
            letter-spacing:0;color:#141418;font-weight:500;}
  .pad[data-m="play"]{background:#141418;border-color:#141418;}
  .pad[data-m="play"] .pad-main{color:#fff;}
  .pad[data-m="play"] .pad-sub{color:#b8b8be;}
  .pad.hit{background:#3a3a42;}
  .pad.hit .pad-main{color:#fff;}

  /* ---- beat flash (silent practice) ----
     The pulse lives on the pad itself, not the page — flashing the whole
     screen was distracting; the button is where your finger already is. */
  .pad.pulse,.pad.pulse-accent{transition:background 70ms linear;}
  .pad.pulse{background:#ebebe6;}
  .pad.pulse-accent{background:#dcdcd4;}
  .pad[data-m="play"].pulse{background:#26262c;}
  .pad[data-m="play"].pulse-accent{background:#323239;}

  /* ---- links ---- */
  .links{display:flex;justify-content:center;gap:26px;}
  .links button{
    background:none;border:none;color:#6d6d75;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;cursor:pointer;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:5px 0;
    border-bottom:1px solid transparent;transition:color .15s,border-color .15s;
  }
  .links button:active{color:#141418;border-color:#141418;}
  .links button:disabled{opacity:.3;}

  /* ---- level-up suggestion ---- */
  .promo{
    display:none;align-items:center;gap:12px;padding:12px 14px;
    border:1px solid #141418;border-radius:3px;background:#f7f7f5;
  }
  .promo.on{display:flex;}
  .promo-txt{flex:1;font-size:12px;color:#141418;line-height:1.45;}
  .promo-act{display:flex;gap:8px;flex-shrink:0;}
  .promo-act button{
    border:1px solid #d4d4ce;background:#fff;color:#6d6d75;border-radius:3px;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    padding:8px 10px;cursor:pointer;
  }
  .promo-act #promoYes{background:#141418;color:#fff;border-color:#141418;font-weight:600;}

  /* ---- result ---- */
  .res{display:none;flex-direction:column;gap:9px;padding-top:16px;border-top:1px solid #d4d4ce;}
  .res.on{display:flex;}
  .res-hd{display:flex;align-items:baseline;justify-content:space-between;}
  .res-pct{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;font-size:26px;letter-spacing:-.02em;color:#141418;}
  .res-note{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#6d6d75;}
  .res-row{display:flex;justify-content:space-between;font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
           font-size:10.5px;color:#6d6d75;letter-spacing:.04em;}
  .res-row span:last-child{color:#141418;}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding-top:4px;
          font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;font-size:9px;color:#6d6d75;letter-spacing:.03em;}
  .legend span{display:flex;align-items:center;gap:5px;}
  .sw{width:12px;height:4px;display:inline-block;border-radius:1px;}
  .sw.ok{background:#1f8a4c;}
  .sw.warn{background:#b07d10;}
  .sw.miss{background:transparent;border:1px dashed #c0392b;height:5px;}
  .sw.ref{background:transparent;border:1px solid #9a9aa2;height:5px;}

  footer{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;font-size:9.5px;letter-spacing:.08em;
         color:#9a9aa2;text-align:center;}
  footer button{background:none;border:none;color:#6d6d75;font:inherit;
                text-decoration:underline;cursor:pointer;}
</style>
</head>
<body>
<div id="backdrop"></div>
<div class="wrap">

  <header>
    <div class="mark">Pulse</div>
    <div class="meta" id="meta"></div>
  </header>

  <div class="lv">
    <div class="lv-txt" id="lvTxt"></div>
    <div class="stepper">
      <button id="down" aria-label="easier">−</button>
      <button id="up" aria-label="harder">+</button>
    </div>
  </div>

  <div class="tempo">
    <button class="tbtn" id="bpmDown" aria-label="slower">−</button>
    <div class="tread">
      <span class="tval" id="bpmVal">58</span>
      <span class="tunit">BPM</span>
    </div>
    <button class="tbtn" id="bpmUp" aria-label="faster">+</button>
  </div>

  <div class="beats" id="beats">
    <i></i><i></i><i></i><i></i>
  </div>

  <div class="score" id="score"></div>

  <div class="deck">
    <button class="nav" id="prevBtn" aria-label="previous pattern">‹</button>
    <div class="pad" id="pad" data-m="idle">
      <div class="pad-main" id="padMain">Begin</div>
      <div class="pad-sub" id="padSub">tap to start · swipe for another</div>
    </div>
    <button class="nav" id="nextBtn" aria-label="next pattern">›</button>
  </div>

  <div class="links">
    <button id="hear">Show me</button>
    <button id="silent">Sound on</button>
  </div>

  <div class="promo" id="promo">
    <div class="promo-txt" id="promoTxt"></div>
    <div class="promo-act">
      <button id="promoNo">Stay</button>
      <button id="promoYes">Level up</button>
    </div>
  </div>

  <div class="res" id="res">
    <div class="res-hd">
      <div class="res-pct" id="rPct">—</div>
      <div class="res-note" id="rNote"></div>
    </div>
    <div class="res-row"><span>onsets caught</span><span id="rHits">0/0</span></div>
    <div class="res-row"><span>sustain correct</span><span id="rSus">0/0</span></div>
    <div class="res-row"><span>spread</span><span id="rErr">—</span></div>
    <div class="res-row"><span>tendency</span><span id="rBias">—</span></div>
    <div class="res-row"><span>extra taps</span><span id="rExtra">0</span></div>
    <div class="res-row"><span>auto latency fix</span><span id="rCal">0ms</span></div>
    <div class="legend">
      <span><i class="sw ok"></i>right length</span>
      <span><i class="sw warn"></i>held wrong</span>
      <span><i class="sw miss"></i>missed</span>
      <span><i class="sw ref"></i>notated</span>
    </div>
  </div>

  <footer>progress saved locally · <button id="reset">reset</button></footer>
</div>

<script>
"use strict";
(function(){

/* ══════════════════════════════════════════════════════════
   1. RHYTHM MODEL
   1 beat = 12 units → eighths(6) sixteenths(3) triplets(4) all exact
   ══════════════════════════════════════════════════════════ */
const U = 12, BEATS = 4, BAR = U*BEATS;

// Cell notes are [duration, isRest, tiedToNext]. A tie means the NEXT note is
// a continuation of this one: one sustained sound, two noteheads, joined by an
// arc — which is how you write a note that crosses a beat while keeping the
// beat visible.
const CELLS = [
  // pedagogic order: pulse → long notes → beamed subdivisions → rests → ties/syncopation
  {lv:1, w:5, notes:[[12,0]]},                                   // quarter
  {lv:1, w:2, notes:[[12,1]]},                                   // quarter rest
  {lv:2, w:3, notes:[[24,0]]},                                   // half
  {lv:3, w:9, notes:[[6,0],[6,0]]},                              // BEAMED eighth pair
  {lv:4, w:1, notes:[[24,1]]},                                   // half rest
  {lv:5, w:2, notes:[[6,0],[6,1]]},                              // eighth + rest
  {lv:5, w:2, notes:[[6,1],[6,0]]},                              // off-beat eighth
  // ties across the beat — the written form of syncopation
  {lv:6, w:5, notes:[[6,0],[6,0,1],[6,0],[6,0]]},                // 8 · 8~8 · 8
  {lv:6, w:3, notes:[[6,0],[6,0,1],[12,0]]},                     // 8 · 8~quarter
  {lv:6, w:2, notes:[[18,0],[6,0]]},                             // dotted quarter + eighth
  {lv:6, w:2, notes:[[6,0],[12,0],[6,0]]},                       // syncopation, untied
  {lv:7, w:4, notes:[[3,0],[3,0],[3,0],[3,0]]},                  // four sixteenths
  {lv:7, w:1, notes:[[6,0],[3,0],[3,0]]},
  {lv:7, w:1, notes:[[3,0],[3,0],[6,0]]},
  {lv:8, w:3, notes:[[4,0],[4,0],[4,0]], trip:true},             // triplet
];
const cellLen = c => c.notes.reduce((s,n) => s+n[0], 0);

const NAMES = ['quarter notes & rests','adds half notes',
               'adds beamed eighth pairs','adds half rests','adds off-beat eighths',
               'ties & syncopation','adds sixteenths','adds triplets',
               'mixed, three bars','everything, faster'];
const barsAt = lv => lv<=1 ? 1 : lv<=6 ? 2 : lv<=8 ? 3 : 4;
const bpmAt  = lv => 58 + (lv-1)*4;

function pick(list){
  let t = 0; for(const c of list) t += c.w;
  let r = Math.random()*t;
  for(const c of list){ if(r < c.w) return c; r -= c.w; }
  return list[list.length-1];
}

// One bar: [{onset, dur, rest, trip, tie}] summing to exactly BAR.
// `tie` means the following note continues this one rather than re-attacking.
function makeBar(lv){
  const pool = CELLS.filter(c => c.lv <= lv);
  const out = [];
  let at = 0;
  while(at < BAR){
    const room = BAR - at;
    const cell = pick(pool.filter(c => cellLen(c) <= room));
    for(const [dur, rest, tie] of cell.notes){
      out.push({onset:at, dur, rest:!!rest, trip:!!cell.trip, tie:!!tie});
      at += dur;
    }
  }
  // A tie needs something to tie to, and we never tie across a bar line here.
  if(out.length) out[out.length-1].tie = false;
  for(let i=0;i<out.length;i++){
    if(!out[i].tie) continue;
    if(i+1 >= out.length || out[i+1].rest){ out[i].tie = false; continue; }
    // A tie only earns its keep when it CROSSES a beat: tying two eighths
    // inside one beat is just a quarter note badly spelled.
    if((out[i].onset + out[i].dur) % U !== 0) out[i].tie = false;
  }
  return out;
}
function makeBars(lv){
  let out;
  // Rests can legitimately fill a whole bar, which would hand the reader a
  // pattern with nothing to play. Regenerate until there's something there.
  for(let guard=0; guard<40; guard++){
    out = Array.from({length:barsAt(lv)}, () => makeBar(lv));
    const sounding = out.flat().filter(n => !n.rest).length;
    if(sounding >= 2) break;
  }
  // Ties over the bar line: the bar line is by definition a beat boundary, so
  // this is the same device as a within-bar tie, just spanning the measure.
  if(lv >= 6){
    for(let i=0;i<out.length-1;i++){
      const last = out[i][out[i].length-1];
      const first = out[i+1][0];
      if(last.rest || first.rest || last.tie) continue;
      if(last.dur >= 24 || first.dur >= 24) continue;   // keep it to short values
      if(Math.random() < 0.3) last.tie = true;
    }
  }
  // final sweep: a tie must have a sounding note to land on
  const flat = out.flat();
  for(let i=0;i<flat.length;i++){
    if(flat[i].tie && (i+1 >= flat.length || flat[i+1].rest)) flat[i].tie = false;
  }
  return out;
}

/* ══════════════════════════════════════════════════════════
   2. BEAMING — the real engraving rule.
   Beams join sub-beat notes only, never cross a beat boundary,
   and break at rests. Primary beam spans the group; secondary
   beams span sub-runs of sixteenths.
   ══════════════════════════════════════════════════════════ */
function beamGroups(bar){
  const groups = [];
  let cur = [];
  const flush = () => { if(cur.length > 1) groups.push(cur); cur = []; };
  bar.forEach((n, i) => {
    if(n.rest || n.dur >= U){ flush(); return; }
    if(!cur.length){ cur = [i]; return; }
    const p = bar[cur[cur.length-1]];
    const sameBeat = Math.floor(n.onset/U) === Math.floor(p.onset/U);
    if(sameBeat && p.onset + p.dur === n.onset) cur.push(i);
    else { flush(); cur = [i]; }
  });
  flush();
  return groups;
}
function sixteenthRuns(bar, group){
  const runs = []; let cur = [];
  for(const i of group){
    if(bar[i].dur <= 3) cur.push(i);
    else { if(cur.length > 1) runs.push(cur); cur = []; }
  }
  if(cur.length > 1) runs.push(cur);
  return runs;
}

/* ══════════════════════════════════════════════════════════
   3. SVG NOTATION
   ══════════════════════════════════════════════════════════ */
// SVG presentation attributes (fill=, stroke=) do NOT resolve var() —
// only real CSS properties do. So paint values must be literal here.
const C_INK = '#141418', C_STAFF = '#8b8b93', C_MUTE = '#6d6d75', C_MISS = '#c0392b';
const C_OK = '#1f8a4c', C_WARN = '#b07d10';   // sustain right / sustain off
const C_PANEL = '#f7f7f5', C_EDGE = '#e3e3de';

const VW = 320;            // viewBox width; CSS scales it
const PAD_L = 16, PAD_R = 20;
const SPAN = VW - PAD_L - PAD_R;
const BASE = 62;           // staff line y within a row
const ROW_H = 112;
const STEM = 30, BEAM_T = 4.6, BEAM_GAP = 6.4;
const SW = 6.0;            // notehead half-width (stem offset)

const xAt = u => PAD_L + (u/BAR)*SPAN;

function notehead(x, filled, id){
  const f = filled ? C_INK : 'none';
  return `<ellipse id="${id}" cx="${x}" cy="${BASE}" rx="5.9" ry="4.1"
    transform="rotate(-20 ${x} ${BASE})" fill="${f}"
    stroke="${C_INK}" stroke-width="${filled ? 0 : 1.7}"/>`;
}
const stemUp = (x, top) =>
  `<line x1="${x+SW}" y1="${BASE-1.2}" x2="${x+SW}" y2="${top}" stroke="${C_INK}" stroke-width="1.6"/>`;

// single/double flag for unbeamed eighths & sixteenths
function flags(x, n){
  const top = BASE - STEM;
  let s = '';
  for(let i=0;i<n;i++){
    const y = top + i*6.4;
    s += `<path d="M${x+SW} ${y} C ${x+SW+9} ${y+3.4}, ${x+SW+7} ${y+10}, ${x+SW+4.4} ${y+13.4}
           C ${x+SW+7.4} ${y+7}, ${x+SW+4} ${y+5.4}, ${x+SW} ${y+6}Z" fill="${C_INK}"/>`;
  }
  return s;
}
const dotAfter = x =>
  `<circle cx="${x+11.5}" cy="${BASE-2}" r="1.75" fill="${C_INK}"/>`;

/* rests -------------------------------------------------- */
// quarter rest: the conventional zig-zag with a hooked tail
function restQuarter(x){
  // filled zig-zag, plus a light stroke so it carries the same weight as the
  // other glyphs instead of looking like a hairline squiggle
  return `<path d="M${x-1.8} ${BASE-14}
    C ${x+3} ${BASE-10}, ${x+4.2} ${BASE-8.4}, ${x+0.6} ${BASE-4.6}
    C ${x-3.2} ${BASE-0.8}, ${x-2.6} ${BASE+1.8}, ${x+2.6} ${BASE+4.6}
    C ${x-1.8} ${BASE+3}, ${x-4} ${BASE+6}, ${x+0.4} ${BASE+12}
    C ${x-5.2} ${BASE+6.2}, ${x-0.6} ${BASE+2.4}, ${x+1.6} ${BASE+3.4}
    C ${x-3} ${BASE-0.4}, ${x-2.4} ${BASE-2.8}, ${x+1.6} ${BASE-6}
    C ${x+4} ${BASE-8.6}, ${x+2.4} ${BASE-10.4}, ${x-1.8} ${BASE-14}Z"
    fill="${C_INK}" stroke="${C_INK}" stroke-width="0.7"/>`;
}
// eighth rest: hook blob + oblique stem
function restEighth(x, n){
  n = n || 1;
  const top = BASE - 9 - (n-1)*1.5;
  // heavier stem + bigger hook: the old glyph was too thin to read on a phone
  let s = `<line x1="${x+3.4}" y1="${top}" x2="${x-2.4}" y2="${BASE+9.5}"
             stroke="${C_INK}" stroke-width="2.7" stroke-linecap="round"/>`;
  for(let i=0;i<n;i++){
    const cy = top + 1.5 + i*6.6;
    s += `<circle cx="${x-2.2}" cy="${cy}" r="3.5" fill="${C_INK}"/>`
       + `<path d="M${x-2.2} ${cy-3.4}
            C ${x+5.2} ${cy-4.6}, ${x+6.8} ${cy+1.2}, ${x+3.8} ${cy+2.6}
            C ${x+3.6} ${cy-1.4}, ${x+1} ${cy-2.6}, ${x-2.2} ${cy-3.4}Z"
            fill="${C_INK}"/>`;
  }
  return s;
}
// half rest sits on the line; whole rest hangs below it
const restHalf = x =>
  `<rect x="${x-5}" y="${BASE-6.5}" width="10" height="4.6" fill="${C_INK}"/>
   <line x1="${x-8}" y1="${BASE-1.9}" x2="${x+8}" y2="${BASE-1.9}" stroke="${C_INK}" stroke-width="1.1"/>`;

function restFor(x, dur){
  if(dur >= 24) return restHalf(x);
  if(dur >= 12) return restQuarter(x);
  if(dur >= 6)  return restEighth(x, 1);
  return restEighth(x, 2);
}

/* render one bar into an SVG group ----------------------- */
function renderBar(bar, rowIdx, idBase, markMap, tieIn){
  const y0 = rowIdx*ROW_H;
  let s = `<g transform="translate(0 ${y0})">`;

  // staff line + closing tick
  s += `<line x1="${PAD_L-8}" y1="${BASE}" x2="${VW-PAD_R+10}" y2="${BASE}"
          stroke="${C_STAFF}" stroke-width="1"/>`;
  s += `<line x1="${VW-PAD_R+10}" y1="${BASE-14}" x2="${VW-PAD_R+10}" y2="${BASE+14}"
          stroke="${C_STAFF}" stroke-width="1"/>`;

  const groups = beamGroups(bar);
  const inBeam = new Map();                      // note index → group
  groups.forEach(g => g.forEach(i => inBeam.set(i, g)));
  const beamTop = BASE - STEM;

  // beams first
  for(const g of groups){
    const x1 = xAt(bar[g[0]].onset) + SW;
    const x2 = xAt(bar[g[g.length-1]].onset) + SW;
    s += `<rect x="${x1}" y="${beamTop}" width="${x2-x1}" height="${BEAM_T}" fill="${C_INK}"/>`;
    for(const run of sixteenthRuns(bar, g)){
      const a = xAt(bar[run[0]].onset) + SW;
      const b = xAt(bar[run[run.length-1]].onset) + SW;
      s += `<rect x="${a}" y="${beamTop+BEAM_GAP}" width="${Math.max(b-a, 7)}"
              height="${BEAM_T}" fill="${C_INK}"/>`;
    }
    if(bar[g[0]].trip){
      const mid = (x1+x2)/2;
      s += `<text x="${mid}" y="${beamTop-7}" fill="${C_MUTE}" font-size="10"
              font-family="Inter,sans-serif" font-style="italic" text-anchor="middle">3</text>`;
    }
  }

  // ties: an arc under the noteheads (stems are up, so the curve sits below)
  const tieY = BASE + 7.5, tieDip = BASE + 15;
  const arc = (x1, x2) =>
    `<path d="M${x1} ${tieY} Q ${(x1+x2)/2} ${tieDip} ${x2} ${tieY}"
       fill="none" stroke="${C_INK}" stroke-width="1.7" stroke-linecap="round"/>`;

  bar.forEach((n, i) => {
    if(!n.tie) return;
    const x1 = xAt(n.onset) + 2.5;
    if(i+1 < bar.length){
      s += arc(x1, xAt(bar[i+1].onset) - 2.5);           // within this bar
    } else {
      // tie continues over the bar line: draw the half that belongs to this bar,
      // running out past the barline the way a broken tie is engraved
      s += arc(x1, VW - PAD_R + 14);
    }
  });
  // ...and the incoming half, if the previous bar tied into this one
  if(tieIn && bar.length && !bar[0].rest){
    s += arc(PAD_L - 14, xAt(bar[0].onset) - 2.5);
  }

  // notes & rests
  bar.forEach((n, i) => {
    const x = xAt(n.onset);
    if(n.rest){ s += restFor(x, n.dur); return; }

    const id = idBase + '-' + i;
    s += notehead(x, n.dur !== 24, id);
    if(inBeam.has(i)) s += stemUp(x, beamTop + BEAM_T);
    else {
      s += stemUp(x, BASE - STEM);
      if(n.dur === 6 || n.dur === 4) s += flags(x, 1);
      else if(n.dur === 3) s += flags(x, 2);
    }
    if(n.dur === 18) s += dotAfter(x);

    // Only the note that starts the sound carries feedback; a tied
    // continuation has no onset of its own to judge.
    const mk = markMap ? markMap.get(id) : null;
    if(mk) s += feedback(x, mk);
  });

  return s + '</g>';
}

// The feedback lane sits under the staff. For each note it draws the NOTATED
// span as a hollow outline, and what you actually played as a solid bar —
// shifted left/right by your onset error and as long as you actually held it.
// Reading the two against each other shows timing and sustain at a glance.
const LANE = BASE + 27, LANE_H = 5;
const wUnits = u => (u/BAR)*SPAN;

function feedback(x, mk){
  if(mk.status === 'miss'){
    // nothing played: show the empty slot plus a cross
    const room = (VW - PAD_R) - x;
    let s = `<rect x="${x}" y="${LANE}" width="${Math.max(Math.min(wUnits(mk.units), room),4)}" height="${LANE_H}"
               fill="none" stroke="${C_MISS}" stroke-width="0.9" stroke-dasharray="2 2"/>`;
    s += `<path d="M${x-3} ${LANE+LANE_H+5} l6 6 M${x+3} ${LANE+LANE_H+5} l-6 6"
            stroke="${C_MISS}" stroke-width="1.2"/>`;
    return s;
  }

  const col = mk.status === 'hit' ? C_OK : C_WARN;
  // a tie can run past this bar's end; clamp so the lane never overflows
  const room = (VW - PAD_R) - x;
  const target = Math.max(Math.min(wUnits(mk.units), room), 4);
  const offset = wUnits(mk.err / mk.s);                 // onset error → x offset
  const held = Math.max(Math.min(wUnits(mk.held / mk.s), room), 2.5);  // sustain → bar length

  // notated reference
  let s = `<rect x="${x}" y="${LANE}" width="${target}" height="${LANE_H}"
             fill="none" stroke="${C_STAFF}" stroke-width="0.9"/>`;
  // what was actually played
  s += `<rect x="${x + offset}" y="${LANE + 0.9}" width="${held}" height="${LANE_H - 1.8}"
          fill="${col}" opacity="0.9"/>`;
  // a tick at the exact target onset, so the offset is readable
  s += `<line x1="${x}" y1="${LANE - 3}" x2="${x}" y2="${LANE + LANE_H + 3}"
          stroke="${C_STAFF}" stroke-width="0.9"/>`;
  // and a short connector showing the direction/size of the error
  if(Math.abs(offset) > 1.2){
    s += `<line x1="${x}" y1="${LANE + LANE_H/2}" x2="${x + offset}" y2="${LANE + LANE_H/2}"
            stroke="${col}" stroke-width="0.8" stroke-dasharray="1.5 1.5"/>`;
  }
  return s;
}

const scoreEl = document.getElementById('score');
let playhead = null;
let lastMarks = null;

// iOS WKWebView can compute an SVG with only a viewBox and CSS height:auto to
// zero height, which hides the notation entirely. So size it explicitly in px.
function scoreWidth(){
  const w = scoreEl.clientWidth
         || Math.min(460, window.innerWidth || 360) - 36;
  return Math.max(240, Math.round(w));
}

function renderScore(bars, markMap){
  lastMarks = markMap || null;
  const vh = bars.length*ROW_H;
  const w = scoreWidth();
  const h = Math.round(w * vh / VW);
  let inner = '';
  // Self-contained panel: the notation must stay legible even if the host
  // webview imposes its own background colour.
  inner += `<rect x="0.5" y="0.5" width="${VW-1}" height="${vh-1}" fill="${C_PANEL}"
              stroke="${C_EDGE}" stroke-width="1" rx="3"/>`;
  bars.forEach((bar, i) => {
    const prev = i > 0 ? bars[i-1] : null;
    const tieIn = !!(prev && prev.length && prev[prev.length-1].tie);
    inner += renderBar(bar, i, 'b'+i, markMap, tieIn);
  });
  inner += `<line id="ph" x1="0" y1="0" x2="0" y2="0" stroke="${C_INK}"
              stroke-width="1.2" opacity="0"/>`;
  scoreEl.innerHTML =
    `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"
       style="width:${w}px;height:${h}px;display:block"
       viewBox="0 0 ${VW} ${vh}" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;
  playhead = document.getElementById('ph');
}

function movePlayhead(units){
  if(!playhead) return;
  if(units === null){ playhead.setAttribute('opacity','0'); return; }
  const row = Math.min(bars.length-1, Math.floor(units/BAR));
  const x = xAt(units - row*BAR);
  const y = row*ROW_H;
  playhead.setAttribute('x1', x); playhead.setAttribute('x2', x);
  playhead.setAttribute('y1', y + BASE - 34);
  playhead.setAttribute('y2', y + BASE + 26);
  playhead.setAttribute('opacity','0.5');
}

/* ══════════════════════════════════════════════════════════
   4. AUDIO
   ══════════════════════════════════════════════════════════ */
let ac = null;
const ctx = () => (ac = ac || new (window.AudioContext||window.webkitAudioContext)());
async function unlock(){
  const a = ctx();
  if(a.state === 'running') return a;
  try{ await Promise.race([a.resume(), new Promise(r=>setTimeout(r,800))]); }catch(e){}
  return a;
}
window.addEventListener('pointerdown', unlock, {once:true, passive:true});
window.addEventListener('keydown', unlock, {once:true});

/* ---- hi-hat: filtered noise burst, used for the metronome ---- */
let noiseBuf = null;
function noise(){
  const a = ctx();
  if(!noiseBuf){
    const len = Math.floor(a.sampleRate * 0.25);
    noiseBuf = a.createBuffer(1, len, a.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2 - 1;
  }
  return noiseBuf;
}
function hat(at, accent){
  const a = ctx();
  const src = a.createBufferSource(); src.buffer = noise();
  const bp = a.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.value = accent ? 9500 : 7800; bp.Q.value = 1.1;
  const hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 5500;
  const g = a.createGain();
  const peak = accent ? 0.20 : 0.10, dur = accent ? 0.05 : 0.032;
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(peak, at+0.0015);
  g.gain.exponentialRampToValueAtTime(0.0001, at+dur);
  src.connect(bp); bp.connect(hp); hp.connect(g); g.connect(a.destination);
  src.start(at); src.stop(at+dur+0.03);
}

/* ---- piano-ish voice: low fundamental, decaying harmonics ---- */
const NOTE_HZ = 196;                 // G3 — low and warm
const PARTIALS = [[1,1],[2,0.42],[3,0.16],[4,0.07],[6,0.03]];

function piano(at, freq, peak, hold){
  const a = ctx();
  const out = a.createGain();
  const f = a.createBiquadFilter();
  f.type = 'lowpass'; f.Q.value = 0.3;
  f.frequency.setValueAtTime(Math.min(6000, freq*14), at);
  f.frequency.exponentialRampToValueAtTime(Math.max(300, freq*3), at+Math.max(0.2, hold));
  const tail = hold + 0.35;          // strings keep ringing past the note
  out.gain.setValueAtTime(0.0001, at);
  out.gain.exponentialRampToValueAtTime(peak, at+0.006);
  out.gain.exponentialRampToValueAtTime(peak*0.28, at+Math.max(0.12, hold*0.7));
  out.gain.exponentialRampToValueAtTime(0.0001, at+tail);
  out.connect(f); f.connect(a.destination);
  for(const [mult, amp] of PARTIALS){
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine';
    o.frequency.value = freq*mult*(1 + (mult>1 ? 0.0008*mult : 0));   // slight inharmonicity
    g.gain.value = amp;
    o.connect(g); g.connect(out);
    o.start(at); o.stop(at+tail+0.05);
  }
}
// kept for compatibility with the count-in call signature
function tone(at, freq, peak, hold){ piano(at, freq, peak, hold); }

// A piano voice that keeps ringing until released, so a held tap sustains.
function openVoice(freq, peak){
  const a = ctx(), now = a.currentTime;
  const out = a.createGain();
  const f = a.createBiquadFilter();
  f.type = 'lowpass'; f.Q.value = 0.3; f.frequency.value = Math.min(6000, freq*14);
  f.frequency.exponentialRampToValueAtTime(Math.max(300, freq*3), now+1.2);
  out.gain.setValueAtTime(0.0001, now);
  out.gain.exponentialRampToValueAtTime(peak, now+0.006);
  // slow natural decay while the key is held down
  out.gain.exponentialRampToValueAtTime(peak*0.3, now+1.6);
  out.connect(f); f.connect(a.destination);
  const oscs = [];
  for(const [mult, amp] of PARTIALS){
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine';
    o.frequency.value = freq*mult*(1 + (mult>1 ? 0.0008*mult : 0));
    g.gain.value = amp;
    o.connect(g); g.connect(out);
    o.start(now); oscs.push(o);
  }
  let closed = false;
  return () => {
    if(closed) return;
    closed = true;
    const t = a.currentTime, rel = 0.09;   // damper falls
    try{
      out.gain.cancelScheduledValues(t);
      out.gain.setValueAtTime(Math.max(out.gain.value, 0.0001), t);
      out.gain.exponentialRampToValueAtTime(0.0001, t+rel);
      for(const o of oscs) o.stop(t+rel+0.04);
    }catch(e){}
  };
}

/* ══════════════════════════════════════════════════════════
   5. STATE — one rAF loop reading the audio clock.
   No timer soup, no gate that can wedge.
   ══════════════════════════════════════════════════════════ */
const pad = document.getElementById('pad');
const padMain = document.getElementById('padMain');
const padSub  = document.getElementById('padSub');
const hearBtn = document.getElementById('hear');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const promoEl = document.getElementById('promo');
const resEl   = document.getElementById('res');

let level = 1, bars = [], run = null, taps = [], launching = false;
let calMs = 0;                 // learned output-latency compensation
let hist = [], histIdx = -1;   // pattern history for prev/next
let userBpm = 0;               // 0 = follow the level default
let silent = false;            // silent practice: flashes only, no audio
let biasBuf = [];              // recent timing errors, pooled across attempts
let passed = false;            // did the last attempt clear the bar?
let streak = 0;                // consecutive clean runs at this level
let promoSnoozedAt = 0;        // streak value when the suggestion was dismissed
const CLEAN_TO_ADVANCE = 3;    // clean runs before we suggest levelling up
const BPM_MIN = 34, BPM_MAX = 168, BPM_STEP = 4;
let lastMain = '', lastSub = '', lastMode = '';

function paintPad(mode, main, sub){
  if(mode !== lastMode){ pad.dataset.m = mode; lastMode = mode; }
  if(main !== lastMain){ padMain.textContent = main; lastMain = main; }
  if(sub  !== lastSub ){ padSub.textContent  = sub;  lastSub  = sub;  }
}
// Tempo the user has chosen, if any; otherwise the level's default.
const tempo = () => userBpm || bpmAt(level);
const spu = () => (60/tempo())/U;

// The one place that decides what actually SOUNDS. Tied notes collapse into a
// single event whose duration spans the whole tie chain. Both playback and
// grading read this, so they can never disagree about a tie.
// Flat view across every bar, so a tie chain can run over a bar line.
function flatBars(){
  const out = [];
  bars.forEach((bar, bi) => bar.forEach((n, i) =>
    out.push({...n, bi, i, id:'b'+bi+'-'+i, abs: bi*BAR + n.onset})));
  return out;
}

function soundingNotes(){
  const flat = flatBars();
  const out = [];
  for(let k=0;k<flat.length;k++){
    const n = flat[k];
    if(n.rest) continue;
    if(k > 0 && flat[k-1].tie && !flat[k-1].rest) continue;   // continuation
    let dur = n.dur, j = k;
    while(flat[j].tie && j+1 < flat.length && !flat[j+1].rest){
      j++; dur += flat[j].dur;                                // absorb the tie
    }
    out.push({ id:n.id, abs:n.abs, units:dur, dur });
  }
  return out;
}

function flatNotes(){
  // kept for playback: same events, expressed the way begin() expects
  return soundingNotes().map(n => ({...n, rest:false}));
}

function begin(kind){
  const a = ctx(), s = spu();
  const notes = flatNotes();
  const t0 = a.currentTime + 0.12;
  const start = t0 + BEATS*U*s;
  const end = start + bars.length*BAR*s;
  try{
    // In silent mode nothing is scheduled at all — the beat flash carries the
    // pulse instead, so you can practise without disturbing anyone.
    if(!silent){
      // Hi-hat metronome: four count-in beats, then it keeps going for the whole
      // pattern so you always have the pulse to play against.
      const totalBeats = BEATS + bars.length*BEATS;
      for(let i=0;i<totalBeats;i++){
        hat(t0 + i*U*s, i % BEATS === 0);
      }
      // The rhythm is only played back in "show me" mode. During an attempt you
      // read it from the notation — the only thing you hear is your own tapping.
      if(kind === 'show'){
        for(const n of notes) if(!n.rest) piano(start + n.abs*s, NOTE_HZ, 0.34, n.dur*s*0.92);
      }
    }
  }catch(e){}
  taps = [];
  resEl.classList.remove('on');
  passed = false;
  renderScore(bars, null);
  run = {kind, t0, start, end, s, notes};
  syncControls();          // must come AFTER `run` is set, or nothing locks
  requestAnimationFrame(tick);
}

// Beat pulse: derived from the audio clock inside the existing loop, so the
// flash can never drift away from the click the way a separate timer would.
const beatDots = [...document.querySelectorAll('#beats i')];

function paintBeat(run, now){
  const {t0, s} = run;
  const idx = Math.floor((now - t0)/(U*s));
  if(idx < 0){ clearBeat(); return; }
  if(idx !== run.lastBeat){
    run.lastBeat = idx;
    run.flashUntil = now + Math.min(0.11, U*s*0.35);
    run.accent = (idx % BEATS) === 0;
  }
  const lit = now < (run.flashUntil || 0);
  const accent = !!run.accent;
  pad.classList.toggle('pulse', lit && !accent);
  pad.classList.toggle('pulse-accent', lit && accent);
  const within = ((idx % BEATS) + BEATS) % BEATS;
  beatDots.forEach((d, i) => {
    d.classList.toggle('on', i === within && lit && !accent);
    d.classList.toggle('accent', i === within && lit && accent);
  });
}
function clearBeat(){
  pad.classList.remove('pulse','pulse-accent');
  beatDots.forEach(d => d.classList.remove('on','accent'));
}

function tick(){
  if(!run) return;
  const now = ctx().currentTime;
  const {t0, start, end, s, kind} = run;
  const showing = kind === 'show';
  paintBeat(run, now);

  if(now < start){
    const n = Math.min(4, Math.max(1, 4 - Math.floor((now-t0)/(U*s))));
    movePlayhead(null);
    paintPad('count', String(n), showing ? 'watch' : 'ready');
  } else if(now <= end + 0.3){
    // The cursor is a reading aid, so it belongs to "show me" only — during an
    // attempt it would just tell you where to tap instead of reading the notes.
    movePlayhead(showing ? (now-start)/s : null);
    paintPad('play', showing ? 'Show me' : 'Tap',
                     showing ? 'follow the notes' : 'read and tap');
  } else {
    const done = run;
    const endedAt = ctx().currentTime;
    run = null;
    movePlayhead(null);
    clearBeat();
    closeOpenTap(endedAt);                   // a note still held at the end counts
    if(voice){ voice(); voice = null; }      // never leave a note ringing
    pad.classList.remove('hit');
    refreshLevel();
    if(done.kind === 'attempt'){
      grade(done);        // sets `passed` and calls syncControls itself
      paintPad('idle','Again', passed ? 'or  ›  for the next one'
                                     : 'same pattern, one more go');
    } else {
      syncControls();
      paintPad('idle','Begin','tap to start · swipe for another');
    }
    return;
  }
  requestAnimationFrame(tick);
}

/* ---- input ------------------------------------------------------------
   Two distinct gestures share the same surface:
     · during an attempt, a press must register the instant it happens
       (timing is the whole point), and hold/release drives the sustain
     · when idle, we can't act on pointerdown — a swipe crossing the pad
       would start an attempt. So "begin" waits for pointerup and only
       fires if the finger barely moved.
   -------------------------------------------------------------------- */
let lastTap = -Infinity;   // must not be 0: currentTime starts near 0, which
                           // would make the debounce eat the very first tap
let voice = null;          // release fn for the currently held tap

const SWIPE_MIN = 45;      // px of horizontal travel that counts as a swipe
const TAP_SLOP  = 12;      // px of movement still considered a tap
let gesture = null;        // {x, y, t, onPad}

function registerTap(){
  const a = ctx(), now = a.currentTime;
  if(now - lastTap < 0.04) return;
  lastTap = now;
  if(voice) voice();                    // retrigger cleanly if already sounding
  closeOpenTap(now);                    // a new press implicitly ends the last
  taps.push({down: now, up: null});     // `up` filled in on release
  if(!silent) voice = openVoice(NOTE_HZ, 0.3);   // rings until release()
  pad.classList.add('hit');
}

function beginAttempt(){
  if(run || launching || !bars.length) return;
  launching = true;
  unlock().then(() => { begin('attempt'); launching = false; },
                () => { launching = false; });
}

// Any tap still held gets closed at `t` (on release, retrigger, or run end),
// so every tap always has a measurable duration.
function closeOpenTap(t){
  for(let i=taps.length-1;i>=0;i--){
    if(taps[i].up === null){ taps[i].up = t; return; }
  }
}

function release(){
  if(voice){ voice(); voice = null; }
  if(run && run.kind === 'attempt') closeOpenTap(ctx().currentTime);
  pad.classList.remove('hit');
}

function onDown(e){
  const onPad = pad.contains(e.target);
  gesture = {x: e.clientX, y: e.clientY, t: Date.now(), onPad};
  // Only a live attempt acts immediately — everything else waits for the lift
  // so we can tell a tap from a swipe.
  if(onPad && run && run.kind === 'attempt'){ e.preventDefault(); registerTap(); }
}

function onUp(e){
  if(run && run.kind === 'attempt'){ release(); gesture = null; return; }
  if(!gesture){ release(); return; }
  const dx = e.clientX - gesture.x, dy = e.clientY - gesture.y;
  const dt = Date.now() - gesture.t;
  const horizontal = Math.abs(dx) > SWIPE_MIN && Math.abs(dx) > Math.abs(dy)*1.4;
  const onPad = gesture.onPad;
  gesture = null;
  release();

  if(!run && horizontal && dt < 700){ fresh(); return; }   // swipe → next pattern
  if(onPad && !run && Math.abs(dx) < TAP_SLOP && Math.abs(dy) < TAP_SLOP) beginAttempt();
}

window.addEventListener('pointerdown', onDown, true);
window.addEventListener('pointerup', onUp, true);
window.addEventListener('pointercancel', () => { gesture = null; release(); }, true);
pad.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if(e.code === 'Space' && !e.repeat){
    e.preventDefault();
    if(run && run.kind === 'attempt') registerTap(); else beginAttempt();
  }
  if(e.code === 'ArrowRight' && !run){ e.preventDefault(); fresh(); }
});
window.addEventListener('keyup', e => {
  if(e.code === 'Space'){ e.preventDefault(); release(); }
});

/* ══════════════════════════════════════════════════════════
   6. GRADING — feedback, not gatekeeping
   ══════════════════════════════════════════════════════════ */
function grade(r){
  const a = ctx();
  // Two corrections, because a consistent lateness is equipment, not the player:
  //  1. whatever the browser admits to (iOS usually reports almost nothing)
  //  2. a learned offset built from the bias measured in previous attempts
  const lat = a.outputLatency || a.baseLatency || 0;
  const cal = calMs/1000;
  const got = taps.map(t => ({
    down: t.down - lat - cal,
    up: (t.up === null ? r.end : t.up) - lat - cal,
  }));
  const beat = 60/tempo();
  // Reading is the skill being trained, not millisecond precision. The window is
  // therefore wide — but never wider than half the gap to the neighbouring note,
  // or a tap could be credited to the wrong note and the read would look right
  // when it wasn't.
  const onsets = soundingNotes().map(n => n.abs);
  let minGap = Infinity;
  for(let i=1;i<onsets.length;i++) minGap = Math.min(minGap, (onsets[i]-onsets[i-1])*r.s);
  const tol = Math.min(beat*0.75, Math.max(0.20, minGap*0.5));

  // Tied notes are ONE sustained sound, so they get one target whose duration
  // covers the whole tie — you hold through the beat rather than re-tapping.
  const targets = soundingNotes().map(n => ({
    id: n.id,
    t: r.start + n.abs*r.s,
    dur: n.units*r.s,
    units: n.units,
  }));

  const used = new Array(got.length).fill(false);
  const marks = new Map();
  const errs = [], signed = [];
  let onsetHits = 0, sustainOk = 0;

  for(const tg of targets){
    let bi = -1, bd = Infinity;
    got.forEach((t, i) => {
      if(used[i]) return;
      const d = Math.abs(t.down - tg.t);
      if(d <= tol && d < bd){ bd = d; bi = i; }
    });

    if(bi < 0){ marks.set(tg.id, {status:'miss', units:tg.units}); continue; }

    used[bi] = true; onsetHits++;
    const err = got[bi].down - tg.t;                 // + = late
    const held = Math.max(0.01, got[bi].up - got[bi].down);
    errs.push(Math.abs(err)); signed.push(err);

    // Sustain only has to be in the right ballpark — long notes held long,
    // short notes short. This catches "stabbed a half note" or "held through a
    // rest", and forgives everything in between.
    const lo = Math.min(tg.dur*0.4, tg.dur - 0.10);
    const hi = Math.max(tg.dur*2.2, tg.dur + 0.30);
    const good = held >= lo && held <= hi;
    const diff = held - tg.dur;
    if(good) sustainOk++;

    marks.set(tg.id, {
      status: good ? 'hit' : (diff < 0 ? 'short' : 'long'),
      err, held, dur: tg.dur, units: tg.units, s: r.s,
    });
  }

  // A note only counts when the onset AND the sustain are right.
  const clean = [...marks.values()].filter(m => m.status === 'hit').length;
  const extra = used.filter(u => !u).length;
  const total = targets.length;
  const pct = total ? Math.round(100*clean/total) : 0;
  const spread = errs.length
    ? Math.round(1000*errs.reduce((s,e) => s+e, 0)/errs.length) : null;
  const bias = signed.length
    ? Math.round(1000*signed.reduce((s,e) => s+e, 0)/signed.length) : null;

  document.getElementById('rPct').textContent = pct + '%';
  document.getElementById('rNote').textContent =
    pct === 100 ? 'clean' : pct >= 70 ? 'close' : 'read it again';
  document.getElementById('rHits').textContent = onsetHits + '/' + total;
  document.getElementById('rSus').textContent = sustainOk + '/' + total;
  document.getElementById('rErr').textContent = spread === null ? '—' : '±' + spread + 'ms';
  document.getElementById('rBias').textContent = bias === null ? '—'
    : (bias > 0 ? '+' : '') + bias + 'ms ' + (Math.abs(bias) < 15 ? 'centred' : bias > 0 ? 'late' : 'early');
  document.getElementById('rExtra').textContent = extra;
  document.getElementById('rCal').textContent = Math.round(calMs) + 'ms';
  resEl.classList.add('on');
  renderScore(bars, marks);      // draws the timing/sustain lane under each staff

  // ---- learn the latency offset ------------------------------------------
  // A steady lateness across every note is the audio pipeline, not the player,
  // so fold the median bias into the calibration and stop punishing them for it.
  // Samples accumulate ACROSS attempts: a sparse bar may only contain one or two
  // notes, which shouldn't stall calibration.
  biasBuf.push(...signed);
  if(biasBuf.length > 24) biasBuf = biasBuf.slice(-24);
  if(biasBuf.length >= 3){
    const sorted = [...biasBuf].sort((x,y) => x-y);
    const median = sorted[Math.floor(sorted.length/2)];
    calMs = Math.max(-350, Math.min(350, calMs + median*1000*0.7));
    biasBuf = [];                     // applied, so don't count it twice
    save();
  }

  // ---- make "next" the obvious move once they've got it -------------------
  // A good run makes "go forward" the obvious move.
  passed = pct >= 80;
  if(passed){ streak++; } else { streak = 0; }
  save();
  syncControls();
  maybeSuggestLevel();
}

/* ---- one place decides what every control looks like ------------------- */
function syncControls(){
  const busy = !!run;
  prevBtn.disabled = busy || histIdx <= 0;
  nextBtn.disabled = busy;
  hearBtn.disabled = busy;
  silentBtn.disabled = busy;
  document.getElementById('up').disabled   = busy || level >= 10;
  document.getElementById('down').disabled = busy || level <= 1;
  document.getElementById('bpmUp').disabled   = busy || tempo() >= BPM_MAX;
  document.getElementById('bpmDown').disabled = busy || tempo() <= BPM_MIN;
  // forward arrow is highlighted only when the last run went well
  nextBtn.classList.toggle('suggest', !busy && passed);
  if(busy) promoEl.classList.remove('on');
}

/* ---- level-up suggestion ---------------------------------------------- */
function maybeSuggestLevel(){
  if(level >= 10 || streak < CLEAN_TO_ADVANCE || streak <= promoSnoozedAt){
    promoEl.classList.remove('on');
    return;
  }
  document.getElementById('promoTxt').innerHTML =
    '<b>' + streak + ' clean runs.</b> Ready for level ' + (level+1) +
    ' — ' + NAMES[level] + '?';
  promoEl.classList.add('on');
}

/* ══════════════════════════════════════════════════════════
   7. LEVEL / PERSISTENCE / BOOT
   ══════════════════════════════════════════════════════════ */
const KEY = 'pulse-v6';
async function load(){
  try{
    const r = await window.storage.get(KEY, false);
    if(r && r.value){
      const v = JSON.parse(r.value);
      if(Number.isInteger(v.level)) level = Math.min(10, Math.max(1, v.level));
      if(typeof v.calMs === 'number') calMs = Math.max(-350, Math.min(350, v.calMs));
      if(Number.isInteger(v.streak)) streak = Math.max(0, v.streak);
      if(Number.isInteger(v.userBpm)) userBpm = v.userBpm ? Math.max(BPM_MIN, Math.min(BPM_MAX, v.userBpm)) : 0;
      if(typeof v.silent === 'boolean') silent = v.silent;
    }
  }catch(e){}
}
const save = () => {
  try{ window.storage.set(KEY, JSON.stringify({level, calMs, streak, userBpm, silent}), false); }catch(e){}
};

function refreshLevel(){
  document.getElementById('lvTxt').innerHTML =
    '<b>Level ' + level + '</b> · ' + NAMES[level-1];
  document.getElementById('meta').innerHTML =
    barsAt(level) + (barsAt(level)>1?' BARS':' BAR');
  document.getElementById('bpmVal').textContent = tempo();
  document.getElementById('bpmDown').disabled = !!run || tempo() <= BPM_MIN;
  document.getElementById('bpmUp').disabled   = !!run || tempo() >= BPM_MAX;
  syncControls();
}
// Pattern history, so the left arrow can go back to something you want to retry.
function showPattern(b){
  bars = b;
  resEl.classList.remove('on');
  passed = false;
  promoEl.classList.remove('on');
  renderScore(bars, null);
  paintPad('idle','Begin','tap to start · swipe for another');
  syncControls();
}
function fresh(){                       // brand-new pattern, drops any forward history
  hist = hist.slice(0, histIdx+1);
  hist.push(makeBars(level));
  if(hist.length > 40){ hist.shift(); }
  histIdx = hist.length-1;
  showPattern(hist[histIdx]);
}
function goNext(){
  if(run) return;
  if(histIdx < hist.length-1){ histIdx++; showPattern(hist[histIdx]); }
  else fresh();
}
function goPrev(){
  if(run || histIdx <= 0) return;
  histIdx--; showPattern(hist[histIdx]);
}
function shift(d){
  if(run) return;
  const n = Math.min(10, Math.max(1, level+d));
  if(n === level) return;
  level = n;
  streak = 0; promoSnoozedAt = 0;      // a new level earns its own streak
  hist = []; histIdx = -1;             // and its own history
  save(); refreshLevel(); fresh();
}

function nudgeTempo(d){
  if(run) return;
  const cur = tempo();
  userBpm = Math.max(BPM_MIN, Math.min(BPM_MAX, cur + d*BPM_STEP));
  save(); refreshLevel();
}
const silentBtn = document.getElementById('silent');
function paintSilent(){
  silentBtn.textContent = silent ? 'Silent' : 'Sound on';
  silentBtn.style.color = silent ? '#141418' : '';
}
silentBtn.addEventListener('click', () => {
  if(run) return;
  silent = !silent;
  paintSilent(); save();
});

document.getElementById('bpmUp').addEventListener('click', () => nudgeTempo(1));
document.getElementById('bpmDown').addEventListener('click', () => nudgeTempo(-1));

nextBtn.addEventListener('click', goNext);
prevBtn.addEventListener('click', goPrev);
document.getElementById('promoYes').addEventListener('click', () => {
  promoEl.classList.remove('on');
  streak = 0; promoSnoozedAt = 0;
  shift(1);
});
document.getElementById('promoNo').addEventListener('click', () => {
  promoEl.classList.remove('on');
  promoSnoozedAt = streak;      // don't nag again until they improve further
  save();
});
document.getElementById('up').addEventListener('click', () => shift(1));
document.getElementById('down').addEventListener('click', () => shift(-1));
hearBtn.addEventListener('click', () => { if(!run) unlock().then(() => begin('show')); });
document.getElementById('reset').addEventListener('click', () => {
  if(run) return;
  level = 1; calMs = 0; streak = 0; promoSnoozedAt = 0; userBpm = 0; silent = false;
  paintSilent();
  hist = []; histIdx = -1;
  save(); refreshLevel(); fresh();
});

// Register the offline worker only when served over http(s) and a manifest is
// reachable. Opened as a bare file (or inside an app webview) this is skipped
// entirely, so the single-file version keeps working unchanged.
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

load().then(() => {
  refreshLevel(); paintSilent(); fresh();
  paintPad('idle','Begin','tap to start · swipe for another');
  // The SVG is sized in real pixels, so it must be rebuilt when the width changes.
  let rt = null;
  const relayout = () => {
    clearTimeout(rt);
    rt = setTimeout(() => { if(bars.length) renderScore(bars, lastMarks); }, 120);
  };
  window.addEventListener('resize', relayout);
  window.addEventListener('orientationchange', relayout);
  // Fonts/layout can settle after first paint; re-measure once.
  setTimeout(() => { if(bars.length) renderScore(bars, lastMarks); }, 250);
});

})();
</script>
